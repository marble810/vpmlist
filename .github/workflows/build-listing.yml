name: Build Repo Listing

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - upstream-package-released
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # the built landing page, uploaded to GitHub Pages
  listPublishDirectory: dist
  # scratch directory where the listing action writes index.json (+ its own template pages)
  listingOutputDirectory: listing-out
  pathToCi: ci

jobs:
  build-listing:
    name: build-listing
    if: >-
      github.event_name != 'repository_dispatch' ||
      github.event.action == 'upstream-package-released'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # check out this repo
      - uses: actions/checkout@v4 # check out automation repo
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build the site
        run: |
          npm run check
          npm run build

      # Generates index.json from source.json + GitHub releases.
      # It also renders the template pages in Website/ — we only keep index.json.
      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listingOutputDirectory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge listing data into the built site
        run: cp ${{env.listingOutputDirectory}}/index.json ${{env.listPublishDirectory}}/index.json

      - name: Remove excluded packages from listing
        run: node scripts/filter-excluded-packages.mjs source.json ${{env.listPublishDirectory}}/index.json

      - name: Summarize listing
        run: node scripts/summarize-listing.mjs ${{env.listPublishDirectory}}/index.json >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
